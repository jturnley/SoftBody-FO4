; SoftBody FO4's F4SE plugin. In 4Stim scenes it gives her body the physics for the act (the opening not in use lets
; the penis through) and lines the penis up with the opening in use, through 4Stim's alignment (saved per scene).
; Keys, with the game in front: iAlignKey aligns now; Shift + it turns auto-align on or off; Ctrl + it goes back to
; the scene's own alignment.
[General]
bSwapPhysics=1
bAutoAlign=1
; F10 (Windows virtual-key code)
iAlignKey=121
; game units: the penis line within this of the opening's centre counts as aligned
fAlignTolerance=0.4
iAlignMaxSteps=5
fAlignMaxStep=6.0
; log her genital bones and the penis every 25 ms to F4SE\SoftBodyFO4.log, for tuning
bLogSamples=0
