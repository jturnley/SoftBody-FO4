; SoftBody FO4's F4SE plugin. In 4Stim scenes it gives her body the physics for the act (the opening not in use lets
; the penis through), opens her rims round the penis, and lines the penis up with the opening in use, through 4Stim's alignment (saved per scene).
; Keys, with the game in front: iAlignKey steps through auto, vagina, anus and off, aligning at once
; (vagina or anus also sets that act's physics); Ctrl + it goes back to the scene's own alignment.
[General]
bSwapPhysics=1
; 1: start in auto mode, 0: start off
bAutoAlign=1
; F11 (Windows virtual-key code)
iAlignKey=122
; game units: the penis line within this of the opening's centre counts as aligned
fAlignTolerance=0.4
iAlignMaxSteps=5
fAlignMaxStep=6.0
; the openings' rims placed round the penis (their bones are kinematic in her physics files); 0 leaves them shut
bDriveOpenings=1
; the penis, in game units at his scale 1: his thickness at the root and at the head end (A-Body's: 2.2, 1.8),
; the length of its rounded tip, and how far its end reaches past its last bone
fPenisRadius=2.2
fPenisRadiusTip=1.8
fPenisTipLength=1.5
fPenisTipExtra=0.75
; how far the shaft is carried on behind its first bone (Penis_01_SMP), into his body, so a rim at the root stays open
fPenisBaseExtra=4.0
; seconds: how quickly the rims follow the penis
fRimSmoothing=0.02
; an opening's edge at rest, from its centre: a rim bone further out (the lips) moves as its edge must
fRimEdge=0.5
; how far an opening's ring moves across onto the penis's line (it swings through a stroke)
fRimFollow=1.5
; how far past his thickness his line may pass an opening's centre and still open it
fRimCatch=1.0
; how far clear of him the holes open
fRimMargin=0.15
; the anus is aimed at its hole's mouth; this moves the aim toward her back (game units; raise it if he still meets
; her forward of the hole, lower it if behind)
fAnusAimBack=0.0
; the vaginal canal's rings: each centred on his line where he passes it (up to fCanalFollow) and opened to
; his thickness there; fCanalCatch: how far past his thickness his line may pass a ring's centre and still open it
bDriveCanal=1
fCanalFollow=8.0
fCanalCatch=8.0
; how far his tip may push the cervix (the canal's closed end) deeper; the canal stretches evenly behind it
fCervixStretch=4.0
; how much wider the uterus grows when another plugin (4Strands) reports it full (0.6: by 60%)
fUterusSwell=0.6
; 1: lay his shaft along the opening in use: straight to its entrance (fBendMax degrees off his line at most),
; then along her canal's middle
bBendPenis=1
fBendMax=20
; seconds: how quickly the bend follows
fBendSmoothing=0.1
; degrees: the most her canal may turn from his line and still have his shaft laid along it
fSnakeMax=60
; calm his balls: hold their swing within fBallMax degrees of where they hang, eased in over fBallSmoothing
; seconds (A-Body's ball physics flings them; SMP keeps simulating, only what is drawn is held)
bCalmBalls=1
fBallMax=20
fBallSmoothing=0.08
; log her genital bones and the penis every 25 ms to F4SE\SoftBodyFO4.log, for tuning
bLogSamples=0
